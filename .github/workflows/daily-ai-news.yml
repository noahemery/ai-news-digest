name: Daily AI News

on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC = 6:17am EST / 7:17am EDT (GitHub may run it a bit late)
  workflow_dispatch:          # "Run workflow" button for manual runs

permissions:
  contents: write

concurrency: daily-ai-news

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build digest
        run: python scripts/fetch_news.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional; headlines-only without it

      - name: Commit and push
        run: |
          git config user.name "Noah Emery"
          git config user.email "230210035+noahemery@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "AI news $(TZ=America/New_York date +%F)"
          git push
